<!DOCTYPE html>
<html>
<head>
    <title>Flexbox All Properties</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;

            flex-flow: row wrap;

            justify-content: space-around;

            align-items: center;

        
            align-content: space-between;

            height: 400px;
            background-color: lightgray;
            padding: 10px;
        }

        .item {
            background-color: skyblue;
            margin: 10px;
            padding: 20px;
            text-align: center;
            width: 100px;
        }


        .item1 {
            order: 3;
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 100px;
            align-self: flex-start;
        }

        .item2 {
            order: 1;
            flex-grow: 2;
            flex-shrink: 1;
            flex-basis: 100px;
            align-self: center;
        }

        .item3 {
            order: 2;
            flex-grow: 1;
            flex-shrink: 2;
            flex-basis: 100px;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Flexbox All Properties</h2>

    <div class="container">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>

</body>
</html>
