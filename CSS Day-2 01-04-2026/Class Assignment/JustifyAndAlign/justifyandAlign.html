<!DOCTYPE html>
<html>
<head>
    <title>Justify vs Align</title>
    <style>
        .container {
            display: flex;
            height: 300px;
            background-color: lightgray;

            justify-content: space-around;

            align-items: center;
        }

        .box {
            background-color: skyblue;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

</body>
</html>
