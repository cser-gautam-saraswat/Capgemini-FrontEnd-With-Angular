<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image in Div</title>
    <style>
        .bg-box {
            width: 100%;
            height: 400px;

            background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
            color: white;
            text-align: center;
            padding-top: 150px;
        }
    </style>
</head>

<body>

    <div class="bg-box">
        <h1>Background Image in Div</h1>
    </div>

</body>

</html>
