<!DOCTYPE html>
<html>
<head>
    <title>Font Properties Example</title>
    <style>
        h1 {
            font-family: Arial, sans-serif;
            font-size: 36px;
            font-weight: bold;
            font-style: normal;
        }

        p.normal {
            font-family: "Times New Roman", serif;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;
        }

        p.italic {
            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: normal;
            font-style: italic;
        }

        p.bold {
            font-family: Verdana, sans-serif;
            font-size: 22px;
            font-weight: bold;
            font-style: normal;
            
        }
    </style>
</head>
<body>

    <h1>Font Properties </h1>

    <p class="normal">
        This is normal text with standard font settings.
    </p>

    <p class="italic">
        This text is italic with different font family.
    </p>

    <p class="bold">
        This text is bold with larger font size.
    </p>

</body>
</html>
