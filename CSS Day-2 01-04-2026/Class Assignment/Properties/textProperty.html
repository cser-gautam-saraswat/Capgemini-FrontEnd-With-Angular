<!DOCTYPE html>
<html>
<head>
    <title>Text Styling Example</title>
    <style>
        h1 {
            text-align: center;
            color: blue;
            letter-spacing: 5px;
            
        }

        p.left {
            text-align: left;
            color: red;
            word-spacing: 10px;
        }

        p.right {
            text-align: right;
            color: green;
            letter-spacing: 3px;
        }

        p.justify {
            text-align: justify;
            color: purple;
            word-spacing: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>Text Styling Demo</h1>

    <p class="left">
        This is left aligned text with increased word spacing.
    </p>

    <p class="right">
        This is right aligned text with increased letter spacing.
    </p>

    <p class="justify">
        This is justified text with both word spacing and letter spacing applied for better readability.
    </p>

</body>
</html>
