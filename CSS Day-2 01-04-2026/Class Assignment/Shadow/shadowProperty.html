<!DOCTYPE html>
<html>
<head>
    <title>Shadow Example</title>
    <style>
        .box {
            width: 300px;
            height: 200px;
            background-color: lightblue;
            margin: 50px auto;
            text-align: center;
            padding-top: 70px;
            box-shadow: 10px 15px 10px gray;
        }

        h1 {
            text-align: center;


            text-shadow: 2px 2px 5px red;
        }
    </style>
</head>
<body>

    <h1>Text Shadow Example</h1>

    <div class="box">
        Box Shadow
    </div>

</body>
</html>
